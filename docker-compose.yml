# Search engine for local development: `docker compose up -d meilisearch`
services:
  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: onemall-meilisearch
    restart: unless-stopped
    ports:
      - "${MEILISEARCH_PORT:-7700}:7700"
    environment:
      MEILI_MASTER_KEY: "${MEILISEARCH_KEY:-change-me-to-a-16+-char-key}"
      MEILI_ENV: "${MEILI_ENV:-development}"
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch-data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7700/health"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  meilisearch-data:
